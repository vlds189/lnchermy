[package]
name = "mc-launcher"
version = "3.0.0"
edition = "2021"

[dependencies]
eframe = "0.36"
egui = "0.36"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
regex = "1"
dirs = "5"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
